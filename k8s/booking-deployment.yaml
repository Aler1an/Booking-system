apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-api
  template:
    metadata:
      labels:
        app: booking-api
    spec:
      containers:
        - name: booking-api
          image: booking-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secret
          livenessProbe:
              httpGet:
              path: /health
              port: 3000
              initialDelaySeconds: 25
              timeoutSeconds: 5
              periodSeconds: 10
          readinessProbe:
              httpGet:
              path: /health
              port: 3000
              initialDelaySeconds: 20
              timeoutSeconds: 5
              periodSeconds: 5
