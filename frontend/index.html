<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Система бронювання</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Система бронювання</h1>

  <!-- Degraded mode banner -->
  <div id="degraded" class="hidden">
    ⚠ Система перевантажена. Повторіть спробу пізніше.
  </div>

  <h2>Додати нове бронювання</h2>
  <form id="bookingForm">
    <input type="text" id="name" placeholder="Ім'я клієнта" required />
    <input type="date" id="date" required />
    <button type="submit">Зберегти</button>
  </form>

  <h2>Список бронювань</h2>
  <button id="loadBookingsBtn">Завантажити бронювання</button>
  <ul id="bookingsList"></ul>

  <!-- JS-файли -->
  <script src="http.js"></script>
  <script src="idempotency.js"></script>
  <script src="script.js"></script>
</body>
</html>
