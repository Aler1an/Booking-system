<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Система бронювання</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Система бронювання</h1>
  </header>

  <!-- Degraded mode banner -->
  <div id="degraded" class="hidden">
    ⚠ Система тимчасово перевантажена. Спробуйте пізніше.
  </div>

  <section class="card">
    <h2>Додати бронювання</h2>
    <form id="bookingForm" class="form-grid">
      <input type="text" id="name" placeholder="Ім'я клієнта" required />
      <input type="date" id="date" required />
      <button type="submit" class="primary-btn">Зберегти</button>
    </form>
  </section>

  <section class="card">
    <div class="flex-between">
      <h2>Список бронювань</h2>
      <button id="loadBookingsBtn" class="secondary-btn">Завантажити</button>
    </div>
    <ul id="bookingsList" class="list"></ul>
  </section>

  <!-- JS -->
  <script src="http.js"></script>
  <script src="idempotency.js"></script>
  <script src="script.js"></script>

</body>
</html>
