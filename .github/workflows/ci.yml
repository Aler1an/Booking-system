name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: backend
        run: npm test --if-present

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t ghcr.io/Aler1an/booking-system-backend:latest .

      - name: Add SHA tag
        run: |
          docker tag ghcr.io/Aler1an/booking-system-backend:latest \
                    ghcr.io/Aler1an/booking-system-backend:sha-${{ github.sha }}

      - name: Add version tag when tag pushed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag ghcr.io/Aler1an/booking-system-backend:latest \
                    ghcr.io/Aler1an/booking-system-backend:${VERSION}

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u Aler1an --password-stdin

      - name: Push images
        run: |
          docker push ghcr.io/Aler1an/booking-system-backend:latest
          docker push ghcr.io/Aler1an/booking-system-backend:sha-${{ github.sha }}

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker push ghcr.io/Aler1an/booking-system-backend:${VERSION}
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage
